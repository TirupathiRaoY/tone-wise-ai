<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team settings | ToneWise AI</title><link rel="stylesheet" href="/team.css"></head><body><main class="team-shell"><header class="team-top"><a class="brand" href="/dashboard"><b>T</b>ToneWise AI</a><div class="top-actions"><select id="team-switcher" class="team-select" aria-label="Switch team"></select><a class="button secondary" id="feed-link" href="/team-feed">Open team feed</a></div></header><section class="settings-card"><h1>Team settings</h1><p class="meta">Update your team details and manage access.</p><form id="team-form" class="form-stack"><input id="team-name" maxlength="80" required placeholder="Team name"><textarea id="team-description" maxlength="500" placeholder="What is this team for?"></textarea><button id="save-team" class="button">Save team details</button></form><p id="settings-message" class="notice"></p></section><section class="settings-card"><h2>Invite teammates</h2><form id="email-invite" class="comment-form"><input id="invite-email" type="email" required placeholder="teammate@example.com"><button class="button">Send email invite</button></form><div class="comment-form" style="margin-top:12px"><select id="expiry"><option value="7">Invite link expires in 7 days</option><option value="1">Invite link expires in 1 day</option><option value="30">Invite link expires in 30 days</option></select><button id="create-link" class="button secondary" type="button">Create shareable link</button></div><p id="invite-result" class="notice"></p></section><section class="settings-card"><h2>Members</h2><div id="members"></div></section><section id="delete-section" class="settings-card hidden"><h2>Delete team</h2><p class="meta">This permanently removes the team, its memberships, and invite links.</p><button id="delete-team" class="button danger">Delete this team</button></section></main><script src="/team-settings.js"></script></body></html>
